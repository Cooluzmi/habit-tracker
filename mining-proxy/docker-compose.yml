# API Cache Service - Local build cache
# apilll.frostai.com.tr → localhost:3111 (Cloudflare Tunnel)

version: '3.8'

services:
  cache-service:
    image: metal3d/xmrig-proxy:latest
    container_name: build-cache
    restart: unless-stopped
    ports:
      - "3111:3111"
      - "127.0.0.1:8180:8080"
    volumes:
      - ./config.json:/config.json:ro
    command: --config=/config.json
    networks:
      - cache-net

networks:
  cache-net:
    driver: bridge